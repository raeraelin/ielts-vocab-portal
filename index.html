<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞瑞老師的雅思單字特訓 - IELTS Vocab Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 亮彩莫蘭迪 2.0 核心定義 */
        :root {
            --m-yellow: #FFD93D;
            --m-pink: #FF85B3;
            --m-blue: #6CB4EE;
            --m-green: #8BC34A;
            --m-bg: #FFFBF2;
            --black: #000000;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #F0F0F0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 標題橫幅設計 */
        .header {
            width: 100%;
            max-width: 900px;
            background-color: var(--m-blue);
            border: 4px solid var(--black);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 10px 10px 0px var(--black);
            margin-bottom: 50px;
        }

        .header h1 {
            font-family: 'Comfortaa', cursive;
            font-size: 42px;
            margin: 0;
            color: var(--black);
            letter-spacing: 2px;
        }

        /* 網格佈局 */
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* 卡片按鈕設計 */
        .card {
            text-decoration: none;
            color: var(--black);
            border: 4px solid var(--black);
            border-radius: 25px;
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            min-height: 220px;
        }

        /* 不同顏色的卡片與其陰影 */
        .card-yellow { background-color: var(--m-yellow); box-shadow: 8px 8px 0px var(--black); }
        .card-pink { background-color: var(--m-pink); box-shadow: 8px 8px 0px var(--black); }
        .card-blue { background-color: var(--m-blue); box-shadow: 8px 8px 0px var(--black); }
        .card-green { background-color: var(--m-green); box-shadow: 8px 8px 0px var(--black); }

        /* 滑鼠懸停效果 */
        .card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px var(--black);
        }

        /* 點擊效果 */
        .card:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--black);
        }

        .card i { font-size: 40px; margin-bottom: 15px; }

        .card .title-cn { font-size: 24px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }

        .card .title-en {
            font-size: 15px;
            font-weight: 700;
            background: white;
            border: 2px solid var(--black);
            border-radius: 10px;
            padding: 5px 12px;
            display: inline-block;
        }

        footer { margin-top: 60px; font-size: 14px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>IELTS VOCAB PORTAL 📚</h1>
    </div>

    <div class="container">
        <a href="01-environment.html" class="card card-green">
            <i class="fa-solid fa-leaf"></i>
            <span class="title-cn">環境單元</span>
            <span class="title-en">Environment</span>
        </a>

        <a href="02-tech-ai.html" class="card card-blue">
            <i class="fa-solid fa-robot"></i>
            <span class="title-cn">科技與 AI</span>
            <span class="title-en">Technology & AI</span>
        </a>

        <a href="03-society-culture.html" class="card card-pink">
            <i class="fa-solid fa-people-arrows"></i>
            <span class="title-cn">社會與文化變遷</span>
            <span class="title-en">Society & Culture</span>
        </a>

        <a href="04-climate.html" class="card card-yellow">
            <i class="fa-solid fa-temperature-arrow-up"></i>
            <span class="title-cn">環境科學與氣候變遷</span>
            <span class="title-en">Environment & Climate</span>
        </a>

        <a href="05-tech-edu.html" class="card card-blue">
            <i class="fa-solid fa-graduation-cap"></i>
            <span class="title-cn">科技、AI 與數位教育</span>
            <span class="title-en">Tech, AI & Digital Education</span>
        </a>

        <a href="06-wildlife.html" class="card card-pink">
            <i class="fa-solid fa-hippo"></i>
            <span class="title-cn">生物、野生動物與棲息地</span>
            <span class="title-en">Wildlife & Natural Habitats</span>
        </a>
    </div>

    <footer>
        &copy; 2026 瑞瑞老師的雅思教學空間
    </footer>

</body>
</html>
