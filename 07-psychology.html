<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞瑞老師 IELTS 單字與閱讀趴 - Psychology & Behavior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@700;900&display=swap');
        
        :root {
            --pop-pink: #FF85B3;
            --pop-yellow: #FFD93D;
            --pop-blue: #4D96FF;
            --pop-green: #6BCB77;
            --pop-purple: #B983FF;
            --pop-orange: #FF9F45;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFF5E4;
        }

        /* Neo-brutalism Style Style Card */
        .dopamine-card {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            transition: all 0.2s ease;
        }

        .dopamine-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #000;
        }

        .tab-btn {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }

        .tab-btn.active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-open .accordion-content {
            max-height: 1000px;
        }

        .accordion-open .arrow { transform: rotate(180deg); }

        .input-correct {
            background-color: #D1FAE5;
            border-color: #059669;
            color: #065F46;
        }

        .hint-shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .modal-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .word-badge {
            border: 2px solid #000;
            display: inline-block;
            padding: 4px 10px;
            margin: 4px;
            border-radius: 8px;
            font-weight: 900;
            background-color: #fff;
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 pt-20 md:pt-24">

    <script src="nav.js"></script>

    <div class="max-w-4xl mx-auto">
        <header class="dopamine-card bg-[var(--pop-purple)] p-6 mb-6 rounded-3xl text-center">
            <h1 class="text-2xl md:text-3xl font-900 text-white mb-3 uppercase tracking-tighter" style="-webkit-text-stroke: 1.5px black;">Psychology & Human Behavior 🧠</h1>
            <div class="bg-white border-4 border-black rounded-full h-6 w-full overflow-hidden flex relative">
                <div id="main-progress" class="bg-[var(--pop-pink)] h-full transition-all duration-500 ease-out border-r-4 border-black" style="width: 0%"></div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-black font-black text-[10px] md:text-sm">
                <span id="learn-prog" class="bg-white border-2 border-black py-1 rounded-xl shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">📖 學習:
