<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞瑞老師 IELTS 單字趴 - Day 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@700;900&display=swap');
        
        :root {
            --pop-pink: #FF85B3;
            --pop-yellow: #FFD93D;
            --pop-blue: #4D96FF;
            --pop-green: #6BCB77;
            --pop-purple: #B983FF;
            --pop-orange: #FF9F45;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFF5E4;
        }

        .dopamine-card {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            transition: all 0.2s ease;
        }

        .dopamine-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #000;
        }

        .tab-btn {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }

        .tab-btn.active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-open .accordion-content {
            max-height: 1000px;
        }

        .accordion-open .arrow {
            transform: rotate(180deg);
        }

        .input-correct {
            background-color: #D1FAE5;
            border-color: #059669;
            color: #065F46;
        }

        .hint-shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="dopamine-card bg-[var(--pop-green)] p-6 mb-6 rounded-3xl text-center">
            <h1 class="text-2xl md:text-3xl font-900 text-black mb-3 uppercase tracking-tighter">Day 5: Environment 🌍</h1>
            <div class="bg-white border-4 border-black rounded-full h-6 w-full overflow-hidden flex relative">
                <div id="main-progress" class="bg-[var(--pop-yellow)] h-full transition-all duration-500 ease-out border-r-4 border-black" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-black font-bold mt-2 text-sm md:text-base">Learned: 0 / 10</p>
        </header>

        <div class="flex gap-3 mb-6">
            <button onclick="switchTab('learn')" id="tab-learn" class="tab-btn active flex-1 py-3 bg-[var(--pop-pink)] rounded-2xl font-bold text-lg text-black">
                📖 學習區
            </button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn flex-1 py-3 bg-white rounded-2xl font-bold text-lg text-black">
                🎯 打字測驗
            </button>
        </div>

        <main>
            <div id="section-learn" class="space-y-4">
            </div>

            <div id="section-quiz" class="hidden space-y-6 py-2">
                <div class="dopamine-card bg-white p-6 rounded-3xl mb-6">
                    <p class="font-bold text-lg mb-2">🎓 測驗說明：</p>
                    <p class="text-gray-700">請根據句意在空格內打出正確的單字（按 Enter 送出）。答錯或卡關時，可以點擊燈泡 💡 獲取提示！答對時系統會自動發音。</p>
                </div>
                <div id="quiz-list" class="space-y-6">
                </div>
            </div>
        </main>
    </div>

    <script>
        const vocabulary = [
            { word: "Devastating", zh: "破壞性的、毀滅性的", coll: "devastating effect / impact", ex: "Climate change has a devastating impact on global agriculture.", exZh: "氣候變遷對全球農業造成了破壞性的影響。", syn: "destructive", ant: "beneficial" },
            { word: "Exploit", zh: "開發、開採、利用", coll: "exploit resources / potential", ex: "We must stop exploiting natural resources without considering the long-term consequences.", exZh: "我們必須停止在不考慮長期後果的情況下開採自然資源。", syn: "utilize, harness", ant: "conserve" },
            { word: "Inevitable", zh: "不可避免的、必然的", coll: "an inevitable outcome / change", ex: "With the continuous rise in global temperatures, sea-level rise seems inevitable.", exZh: "隨著全球氣溫持續上升，海平面上升似乎是不可避免的。", syn: "unavoidable", ant: "preventable" },
            { word: "Scarcity", zh: "缺乏、不足", coll: "water scarcity / resource scarcity", ex: "Many countries are currently facing severe food and water scarcity.", exZh: "許多國家目前正面臨嚴重的食物與水資源短缺。", syn: "shortage, lack", ant: "abundance" },
            { word: "Conservation", zh: "保護、保存", coll: "environmental conservation / energy conservation", ex: "Governments should invest more money in wildlife conservation programs.", exZh: "政府應該在野生動物保護計畫中投入更多資金。", syn: "protection", ant: "destruction" },
            { word: "Discard", zh: "拋棄、丟棄", coll: "discard plastic waste / old habits", ex: "People are encouraged to discard single-use plastics to protect the oceans.", exZh: "人們被鼓勵丟棄一次性塑料以保護海洋。", syn: "throw away", ant: "keep" },
            { word: "Renewable", zh: "可再生的", coll: "renewable energy / sources", ex: "Wind and solar power are forms of renewable energy that do not pollute the air.", exZh: "風能和太陽能是不會污染空氣的可再生能源。", syn: "sustainable", ant: "non-renewable" },
            { word: "Toxic", zh: "有毒的", coll: "toxic chemicals / waste", ex: "The factory was fined for dumping toxic waste into the local river.", exZh: "該工廠因向當地河流傾倒有毒廢物而被罰款。", syn: "poisonous", ant: "harmless" },
            { word: "Consumption", zh: "消耗、消耗量", coll: "energy consumption / high consumption", ex: "Reducing energy consumption is key to lowering our carbon footprint.", exZh: "減少能源消耗是降低我們碳足跡的關鍵。", syn: "usage", ant: "conservation" },
            { word: "Implement", zh: "實施、執行", coll: "implement policies / a new plan", ex: "The city decided to implement stricter recycling regulations next month.", exZh: "該城市決定下個月實施更嚴格的資源回收規定。", syn: "execute, apply", ant: "cancel" }
        ];

        const quizzes = [
            { id: 1, text: "The sudden flood had a [input] effect on the local community, destroying many homes.", answer: "devastating" },
            { id: 2, text: "Experts predict that global energy [input] will double over the next thirty years.", answer: "consumption" },
            { id: 3, text: "To reduce pollution, the local government plans to [input] a new tax on plastic bags.", answer: "implement" },
            { id: 4, text: "Solar power is a highly efficient form of [input] energy that can help replace coal.", answer: "renewable" },
            { id: 5, text: "In desert regions, water [input] is a constant threat to agriculture and survival.", answer: "scarcity" }
        ];

        const cardColors = ['#FFD93D', '#6BCB77', '#B983FF', '#FF9F45', '#FF85B3'];
        let learnedCount = 0;
        let quizCorrectCount = 0;

        window.onload = () => {
            renderLearnSection();
            renderQuizSection();
        };

        function switchTab(tab) {
            const lBtn = document.getElementById('tab-learn');
            const qBtn = document.getElementById('tab-quiz');
            const lSec = document.getElementById('section-learn');
            const qSec = document.getElementById('section-quiz');

            if (tab === 'learn') {
                lBtn.classList.add('active'); lBtn.style.backgroundColor = 'var(--pop-pink)';
                qBtn.classList.remove('active'); qBtn.style.backgroundColor = 'white';
                lSec.classList.remove('hidden'); qSec.classList.add('hidden');
            } else {
                qBtn.classList.add('active'); qBtn.style.backgroundColor = 'var(--pop-orange)';
                lBtn.classList.remove('active'); lBtn.style.backgroundColor = 'white';
                qSec.classList.remove('hidden'); lSec.classList.add('hidden');
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderLearnSection() {
            const container = document.getElementById('section-learn');
            container.innerHTML = '';

            vocabulary.forEach((item, index) => {
                const color = cardColors[index % cardColors.length];
                const div = document.createElement('div');
                div.className = "dopamine-card bg-white rounded-3xl overflow-hidden";
                div.innerHTML = `
                    <div class="p-4 md:p-5 flex items-center justify-between cursor-pointer" style="background-color: ${color}20" onclick="toggleAccordion(this)">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" class="w-6 h-6 border-2 border-black accent-black rounded" onclick="event.stopPropagation(); updateProgress(this)">
                            <div>
                                <span class="text-xl md:text-2xl font-black text-black">${item.word}</span>
                                <span class="text-gray-700 font-bold ml-2 text-sm md:text-base hidden sm:inline">/ ${item.zh}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="event.stopPropagation(); speak('${item.word}')" class="p-2 bg-white rounded-full border-2 border-black hover:bg-gray-100 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[1px] hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] transition-all">
                                <i class="fas fa-volume-up text-black"></i>
                            </button>
                            <i class="fas fa-chevron-down text-black transition-transform duration-300 arrow text-xl"></i>
                        </div>
                    </div>
                    <div class="accordion-content">
                        <div class="p-5 space-y-4 border-t-4 border-black bg-white">
                            <p class="text-gray-700 font-bold sm:hidden mb-2">中文：${item.zh}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div class="bg-[var(--pop-green)]20 p-3 rounded-2xl border-2 border-black" style="background-color: rgba(107, 203, 119, 0.2);">
                                    <p class="text-xs font-black uppercase text-green-800">✅ Synonyms (同義)</p>
                                    <p class="text-sm font-bold mt-1">${item.syn}</p>
                                </div>
                                <div class="bg-[var(--pop-pink)]20 p-3 rounded-2xl border-2 border-black" style="background-color: rgba(255, 133, 179, 0.2);">
                                    <p class="text-xs font-black uppercase text-pink-800">❌ Antonyms (反義)</p>
                                    <p class="text-sm font-bold mt-1">${item.ant}</p>
                                </div>
                            </div>
                            <div class="bg-[#F3F4F6] p-4 rounded-2xl border-2 border-black relative">
                                <button onclick="speak('${item.ex}')" class="absolute top-3 right-3 text-gray-500 hover:text-black transition-colors">
                                    <i class="fas fa-play-circle text-3xl"></i>
                                </button>
                                <p class="text-xs font-black uppercase mb-1 text-[var(--pop-blue)]">搭配詞</p>
                                <p class="font-bold text-md mb-2 text-gray-800 border-b-2 border-gray-300 pb-2 inline-block">${item.coll}</p>
                                <p class="text-base md:text-lg text-black font-semibold pr-10 leading-snug mt-2">${item.ex}</p>
                                <p class="text-sm text-gray-600 mt-2 font-medium">${item.exZh}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderQuizSection() {
            const container = document.getElementById('quiz-list');
            container.innerHTML = '';

            quizzes.forEach((q, index) => {
                const parts = q.text.split('[input]');
                const div = document.createElement('div');
                div.className = "dopamine-card bg-[#F3F4F6] p-5 rounded-3xl relative";
                div.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="bg-black text-white w-8 h-8 flex items-center justify-center rounded-full font-bold flex-shrink-0 mt-1">${index + 1}</span>
                        <div class="text-lg font-medium leading-relaxed w-full text-gray-800">
                            ${parts[0]}
                            <div class="inline-block relative mx-1 align-middle">
                                <input type="text" id="input-${q.id}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                                    class="border-4 border-black bg-white px-3 py-1 w-32 md:w-40 text-center font-bold text-black outline-none focus:bg-yellow-100 transition-colors rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] focus:translate-y-[2px]"
                                    onkeypress="handleQuizInput(event, ${q.id}, '${q.answer}')">
                            </div>
                            ${parts[1]}
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between items-center pl-11">
                        <button onclick="showHint(${q.id}, '${q.answer}')" class="text-sm bg-[var(--pop-yellow)] border-2 border-black rounded-xl px-4 py-2 font-black text-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[2px] hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] transition-all">
                            💡 提示
                        </button>
                        <p id="hint-msg-${q.id}" class="text-sm font-bold text-[var(--pop-blue)] hidden bg-white border-2 border-black px-3 py-1 rounded-lg"></p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleAccordion(element) {
            element.parentElement.classList.toggle('accordion-open');
        }

        function updateProgress(checkbox) {
            const checkboxes = document.querySelectorAll('.learned-check');
            learnedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            
            const progress = ((learnedCount + quizCorrectCount) / 15) * 100;
            
            document.getElementById('main-progress').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `Progress: ${Math.round(progress)}% (${learnedCount + quizCorrectCount}/15)`;

            if (progress === 100) triggerConfetti();
        }

        function handleQuizInput(event, id, answer) {
            if (event.key === 'Enter') {
                const inputEl = document.getElementById(`input-${id}`);
                const hintEl = document.getElementById(`hint-msg-${id}`);
                const userAnswer = inputEl.value.trim().toLowerCase();
                
                if (userAnswer === answer.toLowerCase()) {
                    inputEl.value = answer; 
                    inputEl.disabled = true;
                    inputEl.classList.add('input-correct');
                    inputEl.classList.remove('focus:bg-yellow-100');
                    inputEl.classList.add('bg-green-100');
                    
                    hintEl.innerHTML = "✨ 正確！";
                    hintEl.classList.remove('hidden');
                    hintEl.classList.remove('text-[var(--pop-blue)]');
                    hintEl.classList.add('text-green-700', 'bg-green-100');
                    
                    speak(answer);

                    if (!inputEl.dataset.solved) {
                        inputEl.dataset.solved = "true";
                        quizCorrectCount++;
                        updateProgress();
                    }
                } else {
                    inputEl.parentElement.classList.add('hint-shake');
                    setTimeout(() => inputEl.parentElement.classList.remove('hint-shake'), 500);
                    showHint(id, answer);
                }
            }
        }

        function showHint(id, answer) {
            const hintEl = document.getElementById(`hint-msg-${id}`);
            hintEl.innerHTML = `提示：首字母 <b>${answer.charAt(0).toUpperCase()}</b>，共 <b>${answer.length}</b> 字母。`;
            hintEl.classList.remove('hidden');
            hintEl.classList.remove('text-green-700', 'bg-green-100');
            hintEl.classList.add('text-[var(--pop-blue)]', 'bg-white');
        }

        function triggerConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti({
                    ...defaults, particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#FF85B3', '#FFD93D', '#6BCB77', '#4D96FF']
                });
                confetti({
                    ...defaults, particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#FF85B3', '#FFD93D', '#6BCB77', '#4D96FF']
                });
            }, 250);
            
            setTimeout(() => speak("Amazing job! You have completed Day 5. Perfect!"), 500);
        }
    </script>
</body>
</html>
