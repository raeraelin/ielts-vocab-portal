<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞瑞老師 IELTS 單字趴 - Day 8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@700;900&display=swap');
        
        :root {
            --pop-pink: #FF85B3;
            --pop-yellow: #FFD93D;
            --pop-blue: #4D96FF;
            --pop-green: #6BCB77;
            --pop-purple: #B983FF;
            --pop-orange: #FF9F45;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFF5E4;
        }

        /* Neo-brutalism Style */
        .dopamine-card {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            transition: all 0.2s ease;
        }

        .dopamine-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #000;
        }

        .tab-btn {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }

        .tab-btn.active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-open .accordion-content {
            max-height: 1000px;
        }

        .accordion-open .arrow { transform: rotate(180deg); }

        .input-correct {
            background-color: #D1FAE5;
            border-color: #059669;
            color: #065F46;
        }

        .hint-shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .modal-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative">

    <div class="max-w-3xl mx-auto">
        <header class="dopamine-card bg-[var(--pop-orange)] p-6 mb-6 rounded-3xl text-center">
            <h1 class="text-2xl md:text-3xl font-900 text-white mb-3 uppercase tracking-tighter" style="-webkit-text-stroke: 1px black;">Day 8: Society & Culture 🌍</h1>
            <div class="bg-white border-4 border-black rounded-full h-6 w-full overflow-hidden flex relative">
                <div id="main-progress" class="bg-[var(--pop-green)] h-full transition-all duration-500 ease-out border-r-4 border-black" style="width: 0%"></div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-black font-black text-[10px] md:text-sm">
                <span id="learn-prog" class="bg-white border-2 border-black py-1 rounded-xl shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">📖 學習: 0/10</span>
                <span id="quizA-prog" class="bg-white border-2 border-black py-1 rounded-xl shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">🎯 測驗A: 0/5</span>
                <span id="quizB-prog" class="bg-white border-2 border-black py-1 rounded-xl shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">🎯 測驗B: 0/5</span>
            </div>
        </header>

        <div class="flex flex-wrap md:flex-nowrap gap-3 mb-6">
            <button onclick="switchTab('learn')" id="tab-learn" class="tab-btn active flex-1 py-3 bg-[var(--pop-yellow)] rounded-2xl font-black text-sm md:text-base text-black">📖 學習區</button>
            <button onclick="switchTab('quizA')" id="tab-quizA" class="tab-btn flex-1 py-3 bg-white rounded-2xl font-black text-sm md:text-base text-black">🎯 測驗 Part A</button>
            <button onclick="switchTab('quizB')" id="tab-quizB" class="tab-btn flex-1 py-3 bg-white rounded-2xl font-black text-sm md:text-base text-black">🎯 測驗 Part B</button>
        </div>

        <main>
            <div id="section-learn" class="space-y-4"></div>
            <div id="section-quizA" class="hidden space-y-6 py-2">
                <div class="dopamine-card bg-white p-6 rounded-3xl mb-6">
                    <p class="font-bold text-lg mb-1">🌍 Part A: 人口結構與文化認同</p>
                    <p class="text-gray-700 text-sm">輸入單字後按 Enter 判定。答錯會自動開啟雙階鷹架提示！</p>
                </div>
                <div id="quiz-list-A" class="space-y-6"></div>
            </div>
            <div id="section-quizB" class="hidden space-y-6 py-2">
                <div class="dopamine-card bg-white p-6 rounded-3xl mb-6">
                    <p class="font-bold text-lg mb-1">🏙️ Part B: 社會發展與全球變遷</p>
                    <p class="text-gray-700 text-sm">挑戰後半段核心社會學詞彙，完成最後的 100% 進度！</p>
                </div>
                <div id="quiz-list-B" class="space-y-6"></div>
            </div>
        </main>
    </div>

    <div id="completion-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50 p-4">
        <div class="modal-pop dopamine-card bg-white p-8 md:p-10 rounded-3xl max-w-sm w-full text-center relative">
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 text-7xl">🏆</div>
            <h2 class="text-3xl font-black mt-6 mb-2 text-[var(--pop-blue)]">Perfect!</h2>
            <div class="text-5xl font-black text-[var(--pop-pink)] mb-4">100<span class="text-2xl text-black">%</span></div>
            <p class="text-gray-700 font-bold mb-6 text-base leading-relaxed">瑞瑞老師，太震撼了！您已成功解鎖 Day 8 社會文化主題的所有挑戰。這套雙階提示系統與您的毅力完美交融！</p>
            <button onclick="closeModal()" class="w-full bg-[var(--pop-yellow)] border-4 border-black py-3 rounded-2xl font-black text-lg shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[2px] transition-all">收工，享受這份多巴胺！✨</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "Assimilate", zh: "融入、同化", coll: "assimilate into a new culture", ex: "Immigrants often find it challenging to assimilate into a new society quickly.", exZh: "移民通常發現要在短時間內融入新社會是具有挑戰性的。", syn: "integrate, blend in, adapt", ant: "segregate" },
            { word: "Diversity", zh: "多樣性、多元性", coll: "cultural diversity / ethnic diversity", ex: "Local festivals are a wonderful celebration of cultural diversity in Edmonton.", exZh: "在地節慶是對 Edmonton 文化多樣性的一種精彩慶祝。", syn: "variety, multiplicity", ant: "uniformity" },
            { word: "Demographic", zh: "人口統計的", coll: "demographic change / shift", ex: "The country is preparing for a major demographic shift due to an aging population.", exZh: "由於人口老化，該國正準備應對重大的人口結構轉變。", syn: "population-related", ant: "N/A" },
            { word: "Heritage", zh: "遺產、傳統", coll: "cultural heritage / preserve heritage", ex: "It is our collective responsibility to protect and preserve our historical heritage.", exZh: "保護並保存我們的歷史遺產是我們共同的責任。", syn: "legacy, tradition", ant: "N/A" },
            { word: "Urbanization", zh: "都市化", coll: "rapid urbanization / rate of urbanization", ex: "Rapid urbanization has led to housing shortages in many major cities.", exZh: "快速的都市化已導致許多大城市出現住房短缺的問題。", syn: "urban development", ant: "ruralization" },
            { word: "Integration", zh: "整合、融合", coll: "social integration / integration policy", ex: "Successful integration of minority groups requires effort from the whole community.", exZh: "少數群體的成功融合需要整個社群的努力。", syn: "incorporation, assimilation", ant: "separation, segregation" },
            { word: "Globalization", zh: "全球化", coll: "economic globalization / effects of globalization", ex: "Globalization has allowed ideas and cultures to spread rapidly across borders.", exZh: "全球化使得思想與文化能夠在國界之間迅速傳播。", syn: "internationalization", ant: "isolationism" },
            { word: "Norm", zh: "行為準則、規範", coll: "social norms / cultural norms", ex: "Wearing a mask during flu season has become a social norm in many countries.", exZh: "在流感季節配戴口罩在許多國家已成為一種社會規範。", syn: "standard, rule, convention", ant: "anomaly" },
            { word: "Segregation", zh: "隔離、分離", coll: "racial segregation / social segregation", ex: "The government implemented strict laws to abolish any form of housing segregation.", exZh: "政府實施了嚴格的法律以廢除任何形式的居住隔離。", syn: "separation, isolation", ant: "integration" },
            { word: "Transition", zh: "轉變、過渡", coll: "transition from A to B / smooth transition", ex: "The society is undergoing a dramatic transition into a digital economy.", exZh: "這個社會正經歷向數位經濟的劇烈轉變。", syn: "shift, changeover, conversion", ant: "stagnation" }
        ];

        const quizzesA = [
            { id: 1, text: "It can take generations for an immigrant family to fully [input] into the local community.", answer: "assimilate", synHint: "integrate, blend in completely, adapt to customs" },
            { id: 2, text: "Schools should encourage a respect for cultural [input] from a young age.", answer: "diversity", synHint: "variety, presence of many different cultures" },
            { id: 3, text: "The local council analyzed the [input] data to understand the aging population trend.", answer: "demographic", synHint: "population-related statistics" },
            { id: 4, text: "The ancient temple was declared a UNESCO World [input] site to ensure its safety.", answer: "heritage", synHint: "historical legacy, inherited tradition" },
            { id: 5, text: "The country experienced massive [input] as people moved from farms to industrial towns.", answer: "urbanization", synHint: "growth of cities, movement from rural to urban" }
        ];

        const quizzesB = [
            { id: 6, text: "Language classes play a vital role in the social [input] of newcomers.", answer: "integration", synHint: "incorporation, successful merging into society" },
            { id: 7, text: "Critics argue that [input] can lead to the loss of unique local traditions.", answer: "globalization", synHint: "internationalization, worldwide cultural spread" },
            { id: 8, text: "Shaking hands upon meeting someone is a well-established social [input] here.", answer: "norm", synHint: "standard rule, accepted convention" },
            { id: 9, text: "The fight against racial [input] in schools was a major milestone in civil rights history.", answer: "segregation", synHint: "forced separation, isolating ethnic groups" },
            { id: 10, text: "Young adults often face a difficult [input] when moving from university to the workplace.", answer: "transition", synHint: "period of change, shift, adjustment phase" }
        ];

        const cardColors = ['#FFD93D', '#6BCB77', '#B983FF', '#FF9F45', '#FF85B3'];
        let learnedCount = 0, quizACount = 0, quizBCount = 0;
        const hintStates = {};

        window.onload = () => {
            renderLearn();
            renderQuiz(quizzesA, 'quiz-list-A', 'A');
            renderQuiz(quizzesB, 'quiz-list-B', 'B');
        };

        function switchTab(tab) {
            const tabs = ['learn', 'quizA', 'quizB'];
            const colors = { learn: 'var(--pop-yellow)', quizA: 'var(--pop-pink)', quizB: 'var(--pop-green)' };
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`tab-${t}`).style.backgroundColor = 'white';
                document.getElementById(`section-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).style.backgroundColor = colors[tab];
            document.getElementById(`section-${tab}`).classList.remove('hidden');
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US'; u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }

        function renderLearn() {
            const container = document.getElementById('section-learn');
            vocabulary.forEach((item, index) => {
                const color = cardColors[index % 5];
                const div = document.createElement('div');
                div.className = "dopamine-card bg-white rounded-3xl overflow-hidden mb-4";
                div.innerHTML = `
                    <div class="p-4 md:p-5 flex items-center justify-between cursor-pointer" style="background-color: ${color}20" onclick="toggleAccordion(this)">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" class="w-6 h-6 border-2 border-black accent-black rounded" onclick="event.stopPropagation(); updateProgress()">
                            <span class="text-xl md:text-2xl font-black text-black">${item.word} <small class="text-gray-500 font-bold text-sm">/ ${item.zh}</small></span>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="event.stopPropagation(); speak('${item.word}')" class="w-10 h-10 bg-white border-2 border-black rounded-full flex items-center justify-center hover:bg-gray-100"><i class="fas fa-volume-up"></i></button>
                            <i class="fas fa-chevron-down arrow mt-3"></i>
                        </div>
                    </div>
                    <div class="accordion-content">
                        <div class="p-5 space-y-4 border-t-4 border-black">
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-[var(--pop-green)]20 p-2 rounded-xl border-2 border-black text-xs font-bold">✅ 同義: ${item.syn}</div>
                                <div class="bg-[var(--pop-pink)]20 p-2 rounded-xl border-2 border-black text-xs font-bold">❌ 反義: ${item.ant}</div>
                            </div>
                            <div class="bg-gray-100 p-4 rounded-xl border-2 border-black relative">
                                <p class="text-xs font-black uppercase text-blue-600 mb-1">搭配 & 例句</p>
                                <p class="font-bold text-sm mb-2">${item.coll}</p>
                                <p class="text-black font-semibold text-base leading-snug mb-1">${item.ex}</p>
                                <p class="text-xs text-gray-500">${item.exZh}</p>
                                <button onclick="speak('${item.ex}')" class="absolute bottom-3 right-3 text-gray-400 hover:text-black"><i class="fas fa-play-circle text-2xl"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderQuiz(data, containerId, part) {
            const container = document.getElementById(containerId);
            data.forEach((q, idx) => {
                const parts = q.text.split('[input]');
                const div = document.createElement('div');
                div.className = "dopamine-card bg-[#F3F4F6] p-5 rounded-3xl mb-6 relative";
                div.innerHTML = `
                    <div class="flex items-start gap-3 mb-4">
                        <span class="bg-black text-white w-7 h-7 flex items-center justify-center rounded-full font-bold text-xs mt-1">${part === 'A' ? idx+1 : idx+6}</span>
                        <p class="text-base font-semibold leading-relaxed">${parts[0]}<input type="text" id="input-${q.id}" class="border-b-4 border-black bg-white px-2 mx-1 w-28 text-center outline-none focus:bg-yellow-100 transition-colors" onkeypress="checkAnswer(event, ${q.id}, '${q.answer}', '${part}')">${parts[1]}</p>
                    </div>
                    <div class="flex justify-between items-center pl-10">
                        <button id="hint-btn-${q.id}" onclick="showDynamicHint(${q.id}, '${q.answer}', '${q.synHint}')" class="text-xs bg-[var(--pop-yellow)] border-2 border-black rounded-lg px-3 py-1 font-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:translate-y-0.5 transition-all">💡 獲取語意提示</button>
                        <p id="hint-msg-${q.id}" class="text-[10px] font-bold text-blue-600 hidden bg-white border border-black px-2 py-1 rounded"></p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleAccordion(el) { el.parentElement.classList.toggle('accordion-open'); }

        function showDynamicHint(id, answer, synHint) {
            if (!hintStates[id]) hintStates[id] = 0;
            hintStates[id]++;
            const msg = document.getElementById(`hint-msg-${id}`);
            const btn = document.getElementById(`hint-btn-${id}`);
            if (hintStates[id] === 1) {
                msg.innerHTML = `語意線索: ${synHint}`;
                msg.classList.remove('hidden');
                btn.innerHTML = "🔍 拼字救援";
                btn.classList.replace('bg-[var(--pop-yellow)]', 'bg-[var(--pop-orange)]');
            } else {
                msg.innerHTML = `語意: ${synHint} | 拼字: ${answer.charAt(0).toUpperCase()}...(${answer.length} 字母)`;
                btn.disabled = true; btn.innerHTML = "已獲得最大救援"; btn.style.opacity = '0.5';
            }
        }

        function checkAnswer(e, id, answer, part) {
            if (e.key === 'Enter') {
                const input = document.getElementById(`input-${id}`);
                const hintBtn = document.getElementById(`hint-btn-${id}`);
                const hintMsg = document.getElementById(`hint-msg-${id}`);
                if (input.value.trim().toLowerCase() === answer.toLowerCase()) {
                    input.value = answer; input.disabled = true; input.classList.add('input-correct');
                    if (hintBtn) hintBtn.classList.add('hidden');
                    if (hintMsg) { hintMsg.innerHTML = "✨ Correct!"; hintMsg.classList.replace('text-blue-600', 'text-green-600'); }
                    speak(answer);
                    if (!input.dataset.solved) {
                        input.dataset.solved = "true";
                        if (part === 'A') quizACount++; else quizBCount++;
                        updateProgress();
                        if (quizACount === 5 && quizBCount === 5 && learnedCount === 10) setTimeout(showComplete, 1200);
                    }
                } else {
                    input.parentElement.parentElement.classList.add('hint-shake');
                    setTimeout(() => input.parentElement.parentElement.classList.remove('hint-shake'), 500);
                }
            }
        }

        function updateProgress() {
            const boxes = document.querySelectorAll('input[type="checkbox"]');
            learnedCount = Array.from(boxes).filter(b => b.checked).length;
            document.getElementById('learn-prog').innerText = `📖 學習: ${learnedCount}/10`;
            document.getElementById('quizA-prog').innerText = `🎯 測驗A: ${quizACount}/5`;
            document.getElementById('quizB-prog').innerText = `🎯 測驗B: ${quizBCount}/5`;
            const prog = ((learnedCount + quizACount + quizBCount) / 20) * 100;
            document.getElementById('main-progress').style.width = `${prog}%`;
        }

        function showComplete() {
            document.getElementById('completion-modal').classList.remove('hidden');
            document.getElementById('completion-modal').classList.add('flex');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#FF85B3', '#FFD93D', '#4D96FF', '#6BCB77'] });
            speak("Amazing job, Teacher Rui Rui! You've successfully conquered all challenges for today's lesson!");
        }

        function closeModal() { document.getElementById('completion-modal').classList.add('hidden'); }
    </script>
</body>
</html>
